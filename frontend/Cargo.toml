[package]
name = "frontend"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backend = { path = "../backend", optional = true }
common = { path = "../common" }
service = { path = "../service", optional = true }

api-error-derive = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
cfg-if.workspace = true
garde.workspace = true
gloo-net.workspace = true
http.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_qs = { workspace = true, optional = true }
thiserror.workspace = true
tower-cookies = { workspace = true, optional = true }
tracing.workspace = true

[features]
ssr = [
    "dep:backend",
    "dep:service",

    "dep:api-error-derive",
    "dep:axum",
    "dep:leptos_axum",
    "dep:serde_qs",
    "dep:tower-cookies",
]
