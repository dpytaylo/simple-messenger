[workspace]
members = [".", "backend", "common", "entity", "frontend", "migration", "service"]

[workspace.package]
version = "0.1.0"

[package]
name = "simple-messenger"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace.dependencies]
rpc = { path = "./../rpc/rpc" }

anyhow = "=1.0.86"
async-std = "=1.12.0"
async-trait = "=0.1.81"
axum = "=0.7.5"
axum-extra = { version = "=0.9.3", features = ["typed-header"] }
axum_garde = "=0.20.0"
bincode = "=1.3.3"
cfg-if = "=1.0.0"
chrono = "=0.4.38"
console_error_panic_hook = "=0.1.7"
dotenvy = "=0.15.7"
garde = { version = "=0.20.0", features = ["derive", "email", "email-idna"] }
gloo-net = "=0.6.0"
http = "=1.1.0"
jsonwebtoken = "=9.3.0"
leptos = { version = "=0.6.13", features = ["nightly"] }
leptos_axum = "=0.6.13"
leptos_meta = { version = "=0.6.13", features = ["nightly"] }
leptos_reactive = { version = "=0.6.13", features = ["nightly"] }
leptos_router = { version = "=0.6.13", features = ["nightly"] }
leptos-use = "=0.11.4"
oauth2 = "=4.4.2"
scrypt = "=0.11.0"
sea-orm = "=1.0.0"
sea-orm-migration = "=1.0.0"
serde = "=1.0.207"
serde_json = "=1.0.124"
serde_qs = "=0.13.0"
strum = { version = "=0.26.3", features = ["derive"] }
rand_chacha = "=0.3.1"
reqwest = { version = "=0.12.5", features = ["brotli", "json"] }
time = "=0.3.36"
thiserror = "=1.0.63"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
tracing-web = "=0.1.3"
tokio = "=1.39.2"
tower = "=0.4.13"
tower-http = { version = "=0.5.2",  features = ["cors", "fs"] }
tower-cookies = "=0.10.0"
tower-sessions = "=0.12.2"
uuid = "=1.10.0"
wasm-bindgen = "=0.2.92"

[dependencies]
backend = { path = "backend", optional = true }
common = { path = "common" }
frontend = { path = "frontend" }
entity = { path = "entity", optional = true }
migration = { path = "migration", optional = true }

anyhow.workspace = true
axum = { workspace = true, features = ["ws"], optional = true }
cfg-if.workspace = true
console_error_panic_hook.workspace = true
dotenvy = { workspace = true, optional = true }
http.workspace = true
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
leptos_meta.workspace = true
leptos_router.workspace = true
serde = { workspace = true, features = ["derive"] }
strum.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-web = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tower-cookies = { workspace = true, optional = true }
tower-sessions ={ workspace = true, optional = true }
wasm-bindgen.workspace = true

[features]
hydrate = [
    "frontend/hydrate",

    "leptos/hydrate",
    "leptos_meta/hydrate",
    "leptos_router/hydrate",
    "dep:tracing-web"
]

ssr = [
    "dep:backend",
    "dep:entity",
    "dep:migration",

    "frontend/ssr",

    "dep:axum",
    "dep:dotenvy",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-cookies",
    "dep:tower-sessions",

    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.dev.package.scrypt]
opt-level = 3

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "simple-messenger"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
# style-file = "style/main.css"

# The tailwind input file.
#
# Optional, Activates the tailwind build
tailwind-input-file = "style/tailwind.css"

# The tailwind config file.
#
# Optional, defaults to "tailwind.config.js" which if is not present
# is generated for you
tailwind-config-file = "tailwind.config.js"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
