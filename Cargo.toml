[workspace]
resolver = "2"
members = ["backend", "backend-api", "backend-db", "client", "client-ssr"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
backend = { path = "backend" }
backend-api = { path = "backend-api" }
backend-db = { path = "backend-db" }
client = { path = "client" }
client-ssr = { path = "client-ssr" }

rpc = { path = "./../rpc/rpc" }

anyhow = "=1.0.86"
async-std = "=1.12.0"
async-trait = "=0.1.82"
axum = "=0.7.5"
axum-extra = { version = "=0.9.3", features = ["typed-header"] }
axum_garde = "=0.20.0"
bincode = "=1.3.3"
cfg-if = "=1.0.0"
chrono = "=0.4.38"
codee = "=0.2.0"
console_error_panic_hook = "=0.1.7"
dotenvy = "=0.15.7"
garde = { version = "=0.20.0", features = ["derive", "email", "email-idna"] }
gloo-net = "=0.6.0"
http = "=1.1.0"
jsonwebtoken = "=9.3.0"
leptos = { version = "=0.6.14", features = ["nightly"] }
leptos_axum = "=0.6.14"
leptos_meta = { version = "=0.6.14", features = ["nightly"] }
leptos_reactive = { version = "=0.6.14", features = ["nightly"] }
leptos_router = { version = "=0.6.14", features = ["nightly"] }
leptos-use = { version = "=0.13.3", features = ["use_cookie"] }
nutype = "=0.5.0"
oauth2 = "=4.4.2"
scrypt = "=0.11.0"
serde = { version = "=1.0.209", features = ["derive"] }
serde_json = "=1.0.127"
serde_qs = "=0.13.0"
sqlx = { version = "=0.8.2", features = ["runtime-tokio", "postgres", "uuid"] }
strum = { version = "=0.26.3", features = ["derive"] }
rand_chacha = "=0.3.1"
reqwest = { version = "=0.12.7", features = ["brotli", "json"] }
time = "=0.3.36"
thiserror = "=1.0.63"
tracing = "=0.1.40"
tracing-subscriber = "=0.3.18"
tracing-web = "=0.1.3"
tokio = "=1.40.0"
tower = { version = "=0.5.0", features = ["util"] }
tower-http = { version = "=0.5.2",  features = ["cors", "fs", "trace"] }
tower-cookies = "=0.10.0"
tower-sessions = "=0.13.0"
uuid = "=1.10.0"
wasm-bindgen = "=0.2.93"

[profile.dev.package.scrypt]
opt-level = 3

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
